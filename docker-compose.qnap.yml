version: '3.8'

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: byteredapp-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - byteredapp

  db:
    image: mysql:8.0
    container_name: byteredapp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gestion_empresas
      MYSQL_USER: byteredapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /share/Docker/byteredapp/mysql:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - byteredapp

  redis:
    image: redis:7-alpine
    container_name: byteredapp-redis
    volumes:
      - /share/Docker/byteredapp/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - byteredapp

  server:
    build:
      context: ./server
    container_name: byteredapp-server
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=byteredapp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=gestion_empresas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=https://byteredapp.com,https://www.byteredapp.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=BYTERED <sat@bytered.es>
      - TICKETS_EMAIL=sat@bytered.es
      - UPLOADS_DIR=/app/uploads
      - PORT=8000
    volumes:
      - /share/Docker/byteredapp/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - byteredapp

  client:
    build:
      context: ./client
    container_name: byteredapp-client
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - byteredapp

networks:
  byteredapp:
    driver: bridge
