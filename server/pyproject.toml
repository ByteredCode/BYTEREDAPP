[project]
name = "byteredapp-api"
version = "0.1.0"
description = "API REST multi-tenant para BYTEREDAPP"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/core/database.py", "tests/*"]

[tool.coverage.report]
fail_under = 80
