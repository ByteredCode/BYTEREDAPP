name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: byteredapp_test
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: server
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for MySQL
        run: |
          sudo apt-get install -y mysql-client
          until mysqladmin ping -h127.0.0.1 -P3307 -uroot -proot; do sleep 2; done

      - name: Run migrations
        working-directory: server
        run: alembic upgrade head
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_DATABASE: byteredapp_test

      - name: Run tests (SQLite)
        working-directory: server
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=75

      - name: Run tests (MySQL)
        working-directory: server
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=75
        env:
          USE_MYSQL_TEST: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_DATABASE: byteredapp_test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: client
        run: pnpm lint

      - name: Run tests with coverage
        working-directory: client
        run: pnpm test:cov

      - name: Build
        working-directory: client
        run: pnpm build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          tags: byteredapp/server:latest
          load: true

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: byteredapp/client:latest
          load: true
